<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Refraction Through Window</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background-color: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            pointer-events: none;
        }
        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            background-color: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
        }
        #controls input {
            width: 100px;
            margin-left: 10px;
        }
        label {
            margin-right: 20px;
        }
    </style>
</head>
<body>
    <div id="info">Light Refraction Simulation</div>
    <div id="controls">
        <label>
            Refraction Index:
            <input type="range" id="refractionIndex" min="1" max="2.5" step="0.01" value="1.5">
            <span id="refractionValue">1.5</span>
        </label>
        <label>
            Light Rays:
            <input type="range" id="rayCount" min="5" max="50" step="1" value="20">
            <span id="rayCountValue">20</span>
        </label>
        <label>
            Window Angle:
            <input type="range" id="windowAngle" min="0" max="90" step="1" value="0">
            <span id="windowAngleValue">0°</span>
        </label>
    </div>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="main.js"></script>

</body>
</html>
